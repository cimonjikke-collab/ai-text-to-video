<!DOCTYPE html>
<html>
<head>
  <title>AI Text-to-Video</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>AI Text-to-Video</h1>
    <p>Apna idea likho aur AI se video banao.</p>

    <textarea id="idea" placeholder="Example: A cinematic drone shot of mountains at sunrise"></textarea>

    <br>

    <button onclick="generateVideo()">Generate Video</button>

    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
